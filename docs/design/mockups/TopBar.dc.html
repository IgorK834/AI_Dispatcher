<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="routepilot.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="background: #FFFFFF; border-bottom: 1px solid #E9EBEF; font-family: 'Inter', system-ui, sans-serif; color: #1A1D23;">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 14px 40px; min-height: 80px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1A1D23; flex: 1 1 0; min-width: 170px;">
<svg width="34" height="24" viewBox="0 0 34 24" fill="none" aria-hidden="true"><rect x="1" y="2" width="19" height="14" rx="2" fill="#D42A22"></rect><path d="M20 6h6.5l4.5 5.5V16H20Z" fill="#1A1D23"></path><path d="M22.5 8h3.4l2.5 3h-5.9Z" fill="#FFFFFF"></path><circle cx="7" cy="18" r="3.2" fill="#1A1D23"></circle><circle cx="7" cy="18" r="1.2" fill="#FFFFFF"></circle><circle cx="26" cy="18" r="3.2" fill="#1A1D23"></circle><circle cx="26" cy="18" r="1.2" fill="#FFFFFF"></circle></svg>
<span style="font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.02em;">Route<span style="color: #D42A22;">Pilot</span></span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;">
<sc-for list="{{links}}" as="l" hint-placeholder-count="5">
<a href="{{l.href}}" aria-current="{{l.current}}" style="{{l.style}}">{{l.label}}</a>
</sc-for>
</nav>
<div style="flex: 1 1 0; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap;">
<span class="rp-pill rp-pill--synthetic" title="All drivers, vans and offers are generated demo data">SYNTHETIC DATA</span>
<div class="rp-seg" role="group" aria-label="Language"><button type="button" aria-pressed="true">EN</button><button type="button" aria-pressed="false">PL</button></div>
<button type="button" aria-label="{{accountLabel}}" style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 4px; min-height: 44px; cursor: pointer; font-family: 'Inter', sans-serif; color: #1A1D23; text-align: right;">
<span style="display: flex; flex-direction: column; line-height: 1.25;"><span style="font-size: 13px; font-weight: 600;">{{roleLabel}}</span><span style="font-size: 12px; color: #656C76;">{{email}}</span></span>
<span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 50%; background: #1A1D23; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">{{initials}}</span>
</button>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dispatcher","fleet","offers","optimizer","admin","none"],"default":"dispatcher"},"role":{"editor":"enum","options":["admin","dispatcher","demo"],"default":"admin"},"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dispatcher';
    const role = this.props.role ?? 'admin';
    const all = [
      { id: 'dispatcher', label: 'AI Dispatcher', href: 'Main.dc.html' },
      { id: 'fleet', label: 'Fleet', href: 'Fleet.dc.html' },
      { id: 'offers', label: 'Offers', href: 'Offers.dc.html' },
      { id: 'optimizer', label: 'Optimizer', href: 'Optimizer.dc.html' },
      { id: 'admin', label: 'Admin', href: 'Admin.dc.html' }
    ];
    const base = "display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; text-decoration: none; font-size: 14px;";
    const links = all
      .filter((l) => l.id !== 'admin' || role === 'admin')
      .map((l) => ({
        ...l,
        current: l.id === active ? 'page' : undefined,
        style: l.id === active ? base + " color: #D42A22; font-weight: 600; background: #FDEDEC;" : base + " color: #474C55; font-weight: 500;"
      }));
    const email = role === 'demo' ? 'demo@routepilot.local' : (role === 'dispatcher' ? 'dispatcher@routepilot.local' : 'admin@routepilot.local');
    const roleLabel = role.charAt(0).toUpperCase() + role.slice(1);
    return {
      links, email, roleLabel,
      initials: role === 'admin' ? 'AD' : (role === 'demo' ? 'DE' : 'DI'),
      accountLabel: 'Account menu: ' + email + ', role ' + role
    };
  }
}
</script>
</body>
</html>
