<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Van side view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<svg viewBox="0 0 240 112" role="img" aria-label="{{aria}}" style="display: block; width: 100%; height: auto;">
<ellipse cx="122" cy="104" rx="112" ry="5" fill="#1A1D23" opacity="0.08"></ellipse>
<rect x="6" y="10" width="152" height="70" rx="5" fill="#F3F5F8" stroke="#2A2F38" stroke-width="1.6"></rect>
<g stroke="#DCE0E6" stroke-width="1.2">
<path d="M18 13V77M30 13V77M42 13V77M54 13V77M66 13V77M78 13V77M90 13V77M102 13V77M114 13V77M126 13V77M138 13V77M150 13V77"></path>
</g>
<rect x="6" y="58" width="152" height="7" fill="{{accent}}"></rect>
<rect x="14" y="20" width="62" height="18" rx="4" fill="#FFFFFF" stroke="#D5D9E0"></rect>
<text x="45" y="33" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1A1D23">{{label}}</text>
<rect x="6" y="80" width="154" height="6" rx="2" fill="#2A2F38"></rect>
<path d="M158 28H197C204 28 209 31 213 37L226 56C228.5 59.5 230 63 230 67V84H158Z" fill="#FFFFFF" stroke="#2A2F38" stroke-width="1.6" stroke-linejoin="round"></path>
<path d="M199 34C203 34 206 36 208.5 39.5L217 54H199Z" fill="#CFE3F5" stroke="#2A2F38" stroke-width="1.2" stroke-linejoin="round"></path>
<rect x="168" y="35" width="25" height="19" rx="2.5" fill="#CFE3F5" stroke="#2A2F38" stroke-width="1.2"></rect>
<path d="M166 58V80M196 58V80" stroke="#D5D9E0" stroke-width="1.2"></path>
<rect x="186" y="62" width="7" height="2.5" rx="1" fill="#2A2F38"></rect>
<rect x="224" y="64" width="6" height="7" rx="1.5" fill="#E3E6EA" stroke="#2A2F38" stroke-width="1"></rect>
<rect x="156" y="82" width="76" height="7" rx="3" fill="#2A2F38"></rect>
<rect x="206" y="40" width="5" height="10" rx="1.5" fill="#2A2F38"></rect>
<circle cx="46" cy="90" r="13" fill="#2A2F38"></circle><circle cx="46" cy="90" r="5.5" fill="#C9CED6"></circle>
<circle cx="194" cy="90" r="13" fill="#2A2F38"></circle><circle cx="194" cy="90" r="5.5" fill="#C9CED6"></circle>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"BUS-01"},"width":{"editor":"int","default":240,"min":60,"max":800},"accent":{"editor":"color","default":"#D42A22","options":["#D42A22","#1A1D23","#B6BCC6"]},"$preview":{"width":360,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.width ?? 240;
    const label = this.props.label ?? 'BUS-01';
    return {
      label,
      accent: this.props.accent ?? '#D42A22',
      aria: 'Curtain-sider van up to 3.5 t, ' + label,
      rootStyle: 'width: ' + w + 'px; max-width: 100%; font-family: Inter, system-ui, sans-serif; color: #1A1D23;'
    };
  }
}
</script>
</body>
</html>
