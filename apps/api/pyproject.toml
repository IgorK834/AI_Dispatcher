forbidden_modules = ["sqlalchemy", "fastapi", "httpx", "sqlite3", "os", "routepilot.agents", "routepilot.routing", "routepilot.optimization", "routepilot.integrations", "routepilot.fleet", "routepilot.freight", "routepilot.identity"]

[[tool.importlinter.contracts]]
name = "optimization engine is pure"
