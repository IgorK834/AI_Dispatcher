[project]
name = "routepilot-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "fastapi==0.162.4",
  "httpx==0.28.1",
  "langchain==1.5.0",
  "langchain-anthropic==1.7.10",
  "langchain-core==1.8.0",
  "langchain-google-genai==4.5.0",
  "langchain-openai==1.7.4",
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "slowapi==0.1.10",
  "sqlalchemy==2.1.8",
  "sse-starlette==3.7.0",
  "structlog==26.1.0",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routepilot"]

[dependency-groups]
dev = [
  "defusedxml==0.7.1",
  "httpx==0.28.1",
  "hypothesis==6.170.15",
  "import-linter==2.16",
  "mypy==2.4.1",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pyyaml==6.0.3",
  "ruff==0.17.4",
  "schemathesis==4.33.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../../scripts/tests"]
addopts = "--strict-markers"
pythonpath = [".", "../.."]
markers = ["ac(id): acceptance criterion ID", "integration: integration scenarios"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/routepilot"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PGH", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests use assertions (S101) and fixed subprocess commands in isolated fixtures
# (S603/S607); these are not application entry points or untrusted shell input.
"test_*.py" = ["S101", "S603", "S607"]
# S603/S607: this CLI invokes only git without a shell, verifies refs to SHAs,
# and separates all arguments. It must inspect repository diffs for FR-13.
"check_spec_touch.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["routepilot"]

[tool.importlinter]
root_package = "routepilot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "shared is independent"
type = "forbidden"
source_modules = ["routepilot.shared"]
forbidden_modules = ["routepilot.identity", "routepilot.fleet", "routepilot.freight", "routepilot.routing", "routepilot.compliance", "routepilot.optimization", "routepilot.agents", "routepilot.integrations"]

[[tool.importlinter.contracts]]
name = "identity imports no domains"
type = "forbidden"
source_modules = ["routepilot.identity"]
forbidden_modules = ["routepilot.fleet", "routepilot.freight", "routepilot.optimization", "routepilot.agents"]

[[tool.importlinter.contracts]]
name = "fleet boundaries"
type = "forbidden"
source_modules = ["routepilot.fleet"]
forbidden_modules = ["routepilot.optimization.jobs", "routepilot.agents", "routepilot.integrations"]

