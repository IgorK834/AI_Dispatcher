repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --project apps/api ruff format --config apps/api/pyproject.toml
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --project apps/api ruff check --config apps/api/pyproject.toml
        language: system
        types: [python]
      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, yaml]
      - id: eslint
        name: ESLint
        entry: bash scripts/ci/eslint_staged.sh
        language: system
        files: ^apps/web/.*\.(mjs|ts|tsx)$
        exclude: next-env\.d\.ts$
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --staged --redact --config .gitleaks.toml
        language: system
        pass_filenames: false
      - id: whitespace
        name: end-of-file and trailing whitespace
        entry: python3 scripts/check_whitespace.py
        language: system
        types: [text]
