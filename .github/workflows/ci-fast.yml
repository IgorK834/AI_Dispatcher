name: ci-fast

'on':
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Foundation quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      HYPOTHESIS_PROFILE: ci
      NEXT_TELEMETRY_DISABLED: '1'
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '11.3.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies and verified CI tools
        run: |
          uv sync --project apps/api --locked
          pnpm install --frozen-lockfile
          bash scripts/ci/install_tools.sh
      - name: 'Gate 1: formatting and lint'
        if: ${{ !cancelled() }}
        run: |
          cd apps/api
          uv run ruff format --config pyproject.toml --check src tests migrations ../../scripts/*.py ../../scripts/tests
          uv run ruff check --config pyproject.toml src tests migrations ../../scripts/*.py ../../scripts/tests
          cd ../..
          pnpm format:check
          pnpm --filter web lint
      - name: 'Gate 2: strict types'
        if: ${{ !cancelled() }}
        run: make types
      - name: 'Gate 3: unit, API and contract tests with coverage'
        if: ${{ !cancelled() }}
        run: |
          cd apps/api
          uv run pytest tests ../../scripts/tests --ignore=tests/db --ignore=tests/agents --ignore=tests/security -m 'not integration' --cov=routepilot --cov-branch --cov-report=term-missing
          cd ../..
          pnpm --filter web test
      - name: 'Gate 3a: runtime agents with fake models'
        if: ${{ !cancelled() }}
        run: make test-agents
      - name: 'Gate 4: contract drift, compatibility and schemathesis subset'
        if: ${{ !cancelled() }}
        run: bash scripts/ci/contracts.sh
      - name: 'Gate 5: migration up/down/up and database tests'
        if: ${{ !cancelled() }}
        run: make test-db
      - name: 'Gate 8a: secrets scan'
        if: ${{ !cancelled() }}
        run: gitleaks git --redact --log-opts="$CI_BASE_SHA..HEAD" --config .gitleaks.toml
      - name: 'Gate 8c: auth, CSRF and CORS security tests'
        if: ${{ !cancelled() }}
        run: bash scripts/ci/pytest_optional.sh tests/security
      - name: 'Gate 9: production web build and API smoke'
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter web build
          bash scripts/ci/api_smoke.sh
      - name: 'Gate 10: architecture, traceability and spec coupling'
        if: ${{ !cancelled() }}
        run: |
          cd apps/api
          uv run lint-imports
          uv run python ../../scripts/check_spec_touch.py --agent-docs
          uv run python ../../scripts/check_spec_touch.py --base "$CI_BASE_SHA"
          uv run python ../../scripts/trace.py --check
  required:
    name: ci-fast
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 1
    steps:
      - name: Require every quality gate to pass
        env:
          GATES_RESULT: ${{ needs.checks.result }}
        run: test "$GATES_RESULT" = success
